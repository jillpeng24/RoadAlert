<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦚道路警示系統</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; transition: background 0.5s ease; text-align: center; overflow: hidden; color: white; }
        .green { background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%); }
        .red { background: linear-gradient(135deg, #f85032 0%, #e73827 100%); }

        h1 { font-size: 2.8rem; margin: 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .info { font-size: 1.3rem; margin: 15px 20px; opacity: 0.9; }
        .publish-time { font-size: 1rem; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 15px; display: inline-block; margin-bottom: 10px; }
        .timer { font-size: 5rem; font-weight: 800; margin: 5px 0; }
        .car-icon { font-size: 2.5rem; }
        /* 標題車數的數字：放大 1.1 倍，和「車」字之間留一點空隙 */
        .car-num { font-size: 1.1em; font-weight: 800; line-height: 1; margin-right: 0.12em; }

        .button-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        .button-row { width: 90%; display: flex; justify-content: center; gap: 20px; margin-top: 20px; }

        button { border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-weight: 600; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }

        /* 首頁長按鈕 */
        .btn-main { width: 75%; max-width: 300px; padding: 20px; margin: 10px; font-size: 1.6rem; border-radius: 40px; background: white; color: #56ab2f; }

        /* 警示頁面的正方形按鈕 */
        .btn-sq { width: 110px; height: 110px; border-radius: 20px; display: flex; flex-direction: column; align-items: center; justify-content: center; font-size: 1.3rem; background: white; line-height: 1.4; }
        .btn-extend { color: black; }
        .btn-clear { color: #56ab2f; }

        /* 「跟車」按鈕：綠色實心箭頭在左、兩行字在右 */
        #btn-follow { flex-direction: row; gap: 4px; padding: 0; }
        .follow-arrow { width: 30px; height: 44px; flex-shrink: 0; }
        .follow-text { white-space: nowrap; flex-shrink: 0; }   /* 避免 iPhone 把中文字一個一個斷行 */
    </style>
</head>
<body class="green" id="bg">

    <div id="display-area">
        <h1 id="status-text"><span class="car-icon">🚙</span>&nbsp;道路暢通&nbsp;<span class="car-icon">🚙</span></h1>
        <div id="info-text" class="info">請選擇行進方向</div>
        <div id="publish-time" class="publish-time"></div>
        <div id="timer" class="timer" style="display:none;">05:00</div>
    </div>

    <div id="start-buttons" class="button-container">
        <button class="btn-main" onclick="startAlert('up')">&#11014; 我要上山</button>
        <button class="btn-main" onclick="startAlert('down')">&#11015; 我要下山</button>
    </div>

    <div id="reset-area" class="button-container" style="display:none;">
        <div class="button-row">
            <button id="btn-follow" class="btn-sq btn-extend" onclick="extendAlert()"></button>
            <button class="btn-sq btn-clear" onclick="clearAlert()">已通過<br>(解除)</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDAgZJZ7HBbUF4_BfXC2sWr4shkJ4AX0h4",
            authDomain: "road-alert-bd5e1.firebaseapp.com",
            databaseURL: "https://road-alert-bd5e1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "road-alert-bd5e1",
            storageBucket: "road-alert-bd5e1.firebasestorage.app",
            messagingSenderId: "250765942975",
            appId: "1:250765942975:web:2b6ab9e46074cc5ba4e60a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('road_system');

        const ALERT_MS = 5 * 60 * 1000;   // 每次警示 5 分鐘
        let isExtending = false;          // 自己按了跟車時，不再重複播報上／下山語音
        let curDir = null;                // 目前警示的方向（給跟車語音用）
        let lastExpire = null;
        let timerInterval = null;

        // ---------- 小工具 ----------
        const $ = (id) => document.getElementById(id);
        const pad = (n) => String(n).padStart(2, '0');
        const dirWord = (dir) => (dir === 'up') ? "上山" : "下山";

        function speak(text) {
            const speech = new SpeechSynthesisUtterance(text);
            speech.lang = 'zh-TW';
            window.speechSynthesis.speak(speech);
        }

        // 車數文字：1 台「有車」，2～9 台畫面顯示「2車」～「9車」，10 台以上「多車」
        // 語音另外用國字「兩車」～「九車」，唸起來比較自然（不會唸成「二車」）
        function carText(n, forSpeech) {
            n = n || 1;
            if (n <= 1) return "有車";
            if (n >= 10) return "多車";
            if (forSpeech) return ["", "", "兩", "三", "四", "五", "六", "七", "八", "九"][n] + "車";
            return '<span class="car-num">' + n + '</span>車';
        }

        // 中間小字：告訴另一邊的人去哪裡等
        function waitText(dir) {
            return (dir === 'up') ? "要下山者請在孔雀山停車場等候" : "要上山者請在新天鵝堡等候";
        }

        // 綠色實心箭頭：下山朝下，上山把同一個箭頭轉 180 度朝上
        function arrowSvg(dir) {
            const rotate = (dir === 'up') ? ' style="transform: rotate(180deg);"' : '';
            return '<svg class="follow-arrow" viewBox="0 0 24 24" preserveAspectRatio="none"' + rotate + '>' +
                   '<path d="M9 2.5h6v9h5.5L12 21.5 3.5 11.5H9z" fill="#56ab2f" stroke="#56ab2f" stroke-width="1.2" stroke-linejoin="round"/></svg>';
        }

        // ---------- 按鈕 ----------
        function startAlert(dir) {
            isExtending = false;
            const now = Date.now();
            const d = new Date(now);
            const timeStr = `${pad(d.getMonth() + 1)}/${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
            db.set({ status: 'busy', direction: dir, expire_time: now + ALERT_MS, publish_time: timeStr, cars: 1 });
        }

        // 跟車：車數 +1、重新計時（用 transaction，兩人同時按也不會少算）
        function extendAlert() {
            isExtending = true;
            const expire = Date.now() + ALERT_MS;
            db.transaction((d) => {
                if (!d) return d;
                if (d.status !== 'busy') return;   // 警示已解除就不動
                d.cars = (d.cars || 1) + 1;
                d.expire_time = expire;
                return d;
            });
            speak("跟車" + dirWord(curDir) + "，已延長警示，可出發");
        }

        function clearAlert() {
            isExtending = false;
            db.set({ status: 'clear' });
        }

        // ---------- 監聽資料庫，更新畫面 ----------
        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            if (data.status === 'busy' && data.expire_time > Date.now()) {
                curDir = data.direction;
                const word = dirWord(data.direction);

                $('bg').className = 'red';
                $('status-text').innerHTML = "⚠️&nbsp;&nbsp;" + carText(data.cars) + word + "&nbsp;&nbsp;⚠️";
                $('info-text').innerText = waitText(data.direction);
                $('btn-follow').innerHTML = arrowSvg(data.direction) + '<div class="follow-text">跟車<br>' + word + '</div>';   // 只顯示同方向的跟車按鈕
                $('publish-time').innerText = "發布時間：" + data.publish_time;
                $('timer').style.display = 'block';
                $('start-buttons').style.display = 'none';
                $('reset-area').style.display = 'flex';

                // 只有在非「自己按跟車」的情況下，才播報上／下山語音
                if (lastExpire !== data.expire_time && !isExtending) {
                    speak(carText(data.cars, true) + word + "，" + waitText(data.direction));
                }
                lastExpire = data.expire_time;
                updateTimer(data.expire_time);
            } else {
                isExtending = false;
                $('bg').className = 'green';
                $('status-text').innerHTML = '<span class="car-icon">🚙</span>&nbsp;&nbsp;道路暢通&nbsp;&nbsp;<span class="car-icon">🚙</span>';
                $('info-text').innerText = "請選擇行進方向";
                $('publish-time').innerText = "";
                $('timer').style.display = 'none';
                $('start-buttons').style.display = 'flex';
                $('reset-area').style.display = 'none';
                if (timerInterval) clearInterval(timerInterval);
            }
        });

        function updateTimer(expire) {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                const remaining = Math.round((expire - Date.now()) / 1000);
                if (remaining <= 0) {
                    clearInterval(timerInterval);
                    db.update({ status: 'clear' });
                } else {
                    $('timer').innerText = `${Math.floor(remaining / 60)}:${pad(remaining % 60)}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
