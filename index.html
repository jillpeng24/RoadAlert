<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>🦚道路警示系統</title>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.17.1/firebase-database-compat.js"></script>

    <style>
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100vh; transition: background 0.5s ease; text-align: center; overflow: hidden; color: white; }
        .green { background: linear-gradient(135deg, #a8e063 0%, #56ab2f 100%); }
        .red { background: linear-gradient(135deg, #f85032 0%, #e73827 100%); }
        
        h1 { font-size: 2.8rem; margin: 0; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 10px; }
        .info { font-size: 1.3rem; margin: 15px 20px; opacity: 0.9; }
        .publish-time { font-size: 1rem; background: rgba(255,255,255,0.2); padding: 4px 12px; border-radius: 15px; display: inline-block; margin-bottom: 10px; }
        .timer { font-size: 5rem; font-weight: 800; margin: 5px 0; }
        
        .button-container { width: 100%; display: flex; flex-direction: column; align-items: center; }
        
        /* 調整為正方形按鈕的排版 */
        .button-row { width: 90%; display: flex; justify-content: center; gap: 20px; margin-top: 20px; }
        
        button { border: none; cursor: pointer; box-shadow: 0 5px 15px rgba(0,0,0,0.2); font-weight: 600; transition: all 0.2s ease; -webkit-tap-highlight-color: transparent; }
        
        /* 首頁長按鈕 */
        .btn-main { width: 75%; max-width: 300px; padding: 20px; margin: 10px; font-size: 1.6rem; border-radius: 40px; background: white; color: #56ab2f; }
        
        /* 警示頁面的正方形按鈕 */
        .btn-sq { 
            width: 110px; 
            height: 110px; 
            border-radius: 20px; 
            display: flex; 
            flex-direction: column; 
            align-items: center; 
            justify-content: center; 
            font-size: 1.3rem; 
            background: white;
            line-height: 1.4;
        }
        .btn-extend { color: black; } 
        .btn-clear { color: #56ab2f; } 
        .ok-icon { color: #28a745; font-size: 1.8rem; font-weight: bold; margin-bottom: 5px; } /* 綠色O */

        /* 「跟車」按鈕上的大箭頭（綠色） */
        .follow-arrow { font-size: 2.4rem; line-height: 1; color: #56ab2f; margin-bottom: 4px; }

        .car-icon { font-size: 2.5rem; }
    </style>
</head>
<body class="green" id="bg">

    <div id="display-area">
        <h1 id="status-text"><span class="car-icon">🚙</span>&nbsp;道路暢通&nbsp;<span class="car-icon">🚙</span></h1>
        <div id="info-text" class="info">請選擇行進方向</div>
        <div id="publish-time" class="publish-time"></div>
        <div id="timer" class="timer" style="display:none;">05:00</div>
    </div>

    <div id="start-buttons" class="button-container">
        <button class="btn-main" onclick="startAlert('up')">&#11014; 我要上山</button>
        <button class="btn-main" onclick="startAlert('down')">&#11015; 我要下山</button>
    </div>

    <div id="reset-area" class="button-container" style="display:none;">
        <div class="button-row">
            <button id="btn-follow" class="btn-sq btn-extend" onclick="extendAlert()"></button>
            <button class="btn-sq btn-clear" onclick="clearAlert()">已通過<br>(解除)</button>
        </div>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyDAgZJZ7HBbUF4_BfXC2sWr4shkJ4AX0h4",
            authDomain: "road-alert-bd5e1.firebaseapp.com",
            databaseURL: "https://road-alert-bd5e1-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "road-alert-bd5e1",
            storageBucket: "road-alert-bd5e1.firebasestorage.app",
            messagingSenderId: "250765942975",
            appId: "1:250765942975:web:2b6ab9e46074cc5ba4e60a"
        };

        firebase.initializeApp(firebaseConfig);
        const db = firebase.database().ref('road_system');
        let isExtending = false; // 新增開關：防止語音重疊

        function startAlert(dir) {
            isExtending = false; 
            const now = Date.now();
            const expire = now + (5 * 60 * 1000); 
            const d = new Date(now);
            const timeStr = `${(d.getMonth()+1).toString().padStart(2,'0')}/${d.getDate().toString().padStart(2,'0')} ${d.getHours().toString().padStart(2,'0')}:${d.getMinutes().toString().padStart(2,'0')}`;
            const msg = (dir === 'up') ? "有車上山中，請勿出發" : "有車下山中，請勿進入";
            db.set({ status: 'busy', direction: dir, expire_time: expire, publish_time: timeStr, message: msg, cars: 1 });
        }

        function extendAlert() {
            isExtending = true; // 開啟延時狀態，暫停自動播報
            const now = Date.now();
            const expire = now + (5 * 60 * 1000);
            db.transaction((d) => {
                if (!d) return d;
                if (d.status !== 'busy') return;   // 警示已解除就不動
                d.cars = (d.cars || 1) + 1;
                d.expire_time = expire;
                return d;
            });
            
            const speech = new SpeechSynthesisUtterance(
                (window.curDir === 'up' ? "跟車上山" : "跟車下山") + "，已延長警示，可出發");
            speech.lang = 'zh-TW';
            window.speechSynthesis.speak(speech);
        }

        function clearAlert() {
            isExtending = false;
            db.set({ status: 'clear' });
        }

        // 車數文字：1 台「有車」，2～9 台「兩車」～「九車」，10 台以上「多車」
        function carText(n) {
            n = n || 1;
            if (n <= 1) return "有車";
            if (n >= 10) return "多車";
            return ["", "", "兩", "三", "四", "五", "六", "七", "八", "九"][n] + "車";
        }

        // 中間小字：告訴另一邊的人去哪裡等
        function waitText(dir) {
            return (dir === 'up') ? "要下山者，請在孔雀山停車場等候" : "要上山者，請在新天鵝堡等候";
        }

        db.on('value', (snapshot) => {
            const data = snapshot.val();
            if (!data) return;

            const now = Date.now();
            if (data.status === 'busy' && data.expire_time > now) {
                document.getElementById('bg').className = 'red';
                window.curDir = data.direction;   // 記住目前方向，給「跟車」語音用
                const title = carText(data.cars) + ((data.direction === 'up') ? "上山" : "下山");
                document.getElementById('status-text').innerHTML = "⚠️&nbsp;&nbsp;" + title + "&nbsp;&nbsp;⚠️";
                document.getElementById('info-text').innerText = waitText(data.direction);
                // 只顯示和目前方向相同的「跟車」按鈕
                document.getElementById('btn-follow').innerHTML =
                    (data.direction === 'up')
                        ? '<span class="follow-arrow">&#11014;</span><span>跟車上山</span>'
                        : '<span class="follow-arrow">&#11015;</span><span>跟車下山</span>';
                document.getElementById('publish-time').innerText = "發布時間：" + data.publish_time;
                document.getElementById('timer').style.display = 'block';
                document.getElementById('start-buttons').style.display = 'none';
                document.getElementById('reset-area').style.display = 'flex';
                
                // 只有在非「延時按下」的情況下，才播報上/下山語音
                if (window.lastExpire !== data.expire_time && !isExtending) {
                    const speech = new SpeechSynthesisUtterance(title + "，" + waitText(data.direction));
                    speech.lang = 'zh-TW';
                    window.speechSynthesis.speak(speech);
                }
                window.lastExpire = data.expire_time;
                updateTimer(data.expire_time);
            } else {
                isExtending = false;
                document.getElementById('bg').className = 'green';
                document.getElementById('status-text').innerHTML = '<span class="car-icon">🚙</span>&nbsp;&nbsp;道路暢通&nbsp;&nbsp;<span class="car-icon">🚙</span>';
                document.getElementById('info-text').innerText = "請選擇行進方向";
                document.getElementById('publish-time').innerText = "";
                document.getElementById('timer').style.display = 'none';
                document.getElementById('start-buttons').style.display = 'flex';
                document.getElementById('reset-area').style.display = 'none';
                if (window.timerInterval) clearInterval(window.timerInterval);
            }
        });

        function updateTimer(expire) {
            if (window.timerInterval) clearInterval(window.timerInterval);
            window.timerInterval = setInterval(() => {
                const remaining = Math.round((expire - Date.now()) / 1000);
                if (remaining <= 0) {
                    clearInterval(window.timerInterval);
                    db.update({ status: 'clear' });
                } else {
                    const m = Math.floor(remaining / 60);
                    const s = remaining % 60;
                    document.getElementById('timer').innerText = `${m}:${s < 10 ? '0'+s : s}`;
                }
            }, 1000);
        }
    </script>
</body>
</html>
